<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地震台网事件编目与修订</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: .85rem; }
    button { padding: .4rem .8rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1rem; }
    th, td { border: 1px solid #d1d5db; padding: .4rem .6rem; text-align: left; font-size: .9rem; }
    th { background: #f3f4f6; }
    input, select { padding: .35rem .5rem; }
    section { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; background: #e5e7eb; font-size: .8rem; }
    .badge.published, .badge.revised, .badge.applied { background: #d1fae5; }
    .badge.pending { background: #fef3c7; }
    .badge.draft { background: #dbeafe; }
    .badge.rejected, .badge.withdrawn { background: #fee2e2; }
    .error { color: #b91c1c; }
    #reportRows input { width: 7rem; margin-right: .3rem; }
  </style>
</head>
<body>
<main>
  <h1>地震台网事件编目与修订</h1>

  <section>
    <label>用户 <input id="userId" value="analyst-1"></label>
    <label>角色
      <select id="role">
        <option value="analyst">analyst（分析员）</option>
        <option value="reviewer">reviewer（复核员）</option>
        <option value="admin">admin</option>
        <option value="viewer">viewer</option>
      </select>
    </label>
    <button onclick="loadEvents()">刷新事件列表</button>
  </section>

  <section>
    <h2>事件列表</h2>
    <table id="eventTable">
      <thead><tr><th>编号</th><th>标题</th><th>状态</th><th>版本</th><th>震级</th><th>报告数</th><th></th></tr></thead>
      <tbody><tr><td colspan="7">点击“刷新事件列表”加载</td></tr></tbody>
    </table>
  </section>

  <section id="detail" hidden>
    <h2>事件详情 <span id="eventBadge" class="badge"></span></h2>
    <pre id="eventJson"></pre>

    <h3>修订草案</h3>
    <div id="draftList">加载中…</div>

    <h3>新建修订草案</h3>
    <p>
      <label>修订说明 <input id="draftReason" size="30" placeholder="例如：补报台站数据"></label>
      <label>复核震级 <input id="draftMagnitude" type="number" step="0.1" size="6"></label>
    </p>
    <div id="reportRows"></div>
    <p>
      <button onclick="addReportRow()">添加报告行</button>
      <button onclick="createDraft()">创建草案</button>
    </p>

    <h3>历史版本与处理记录</h3>
    <p><button onclick="loadHistory()">查看历史</button></p>
    <div id="history"></div>
  </section>

  <pre id="result">等待操作</pre>
</main>
<script>
let currentEvent = null;

function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value || 'anonymous',
    'X-Role': document.getElementById('role').value,
  };
}

function show(obj, isError) {
  const el = document.getElementById('result');
  el.textContent = JSON.stringify(obj, null, 2);
  el.className = isError ? 'error' : '';
}

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: headers() });
  const body = await response.json();
  if (!response.ok) {
    show(body, true);
    throw new Error(body.error || response.statusText);
  }
  return body;
}

async function loadEvents() {
  const data = await api('/api/events');
  const tbody = document.querySelector('#eventTable tbody');
  tbody.innerHTML = '';
  for (const ev of data.items) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${ev.id.slice(0, 8)}…</td><td>${ev.data.title || ''}</td>` +
      `<td><span class="badge ${ev.status}">${ev.status}</span></td><td>v${ev.version}</td>` +
      `<td>${ev.data.magnitude ?? ''}</td><td>${(ev.data.reports || []).length}</td>`;
    const td = document.createElement('td');
    const btn = document.createElement('button');
    btn.textContent = '打开';
    btn.onclick = () => openEvent(ev.id);
    td.appendChild(btn);
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
  if (!data.items.length) tbody.innerHTML = '<tr><td colspan="7">暂无事件</td></tr>';
}

async function openEvent(id) {
  const ev = await api('/api/entities/' + id);
  currentEvent = ev;
  document.getElementById('detail').hidden = false;
  document.getElementById('eventJson').textContent = JSON.stringify(ev, null, 2);
  const badge = document.getElementById('eventBadge');
  badge.textContent = ev.status + ' v' + ev.version;
  badge.className = 'badge ' + ev.status;
  show(ev);
  await loadDrafts();
  document.getElementById('history').innerHTML = '';
}

async function loadDrafts() {
  const data = await api('/api/revisions');
  const drafts = data.items.filter(d => d.data.event_id === currentEvent.id);
  const box = document.getElementById('draftList');
  if (!drafts.length) {
    box.innerHTML = '<p>暂无修订草案</p>';
    return;
  }
  let html = '<table><thead><tr><th>草案编号</th><th>状态</th><th>提交人</th><th>复核震级</th><th>新增报告</th><th>操作</th></tr></thead><tbody>';
  for (const d of drafts) {
    html += `<tr><td>${d.id}</td><td><span class="badge ${d.status}">${d.status}</span></td>` +
      `<td>${d.created_by}</td><td>${d.data.magnitude ?? ''}</td><td>${(d.data.reports || []).length}</td><td>`;
    if (d.status === 'draft') html += `<button onclick="draftAction('${d.id}','submit')">提交复核</button>`;
    if (d.status === 'pending') {
      html += `<button onclick="draftAction('${d.id}','approve')">复核通过</button> `;
      html += `<button onclick="rejectDraft('${d.id}')">退回</button>`;
    }
    html += '</td></tr>';
  }
  box.innerHTML = html + '</tbody></table>';
}

function addReportRow() {
  const div = document.createElement('div');
  div.innerHTML = '<input placeholder="台站" class="rStation">' +
    '<input placeholder="到时偏移(s)" type="number" class="rOffset">' +
    '<input placeholder="距离(km)" type="number" step="0.1" class="rDist">';
  document.getElementById('reportRows').appendChild(div);
}

async function createDraft() {
  const reports = [...document.querySelectorAll('#reportRows div')].map(div => ({
    station: div.querySelector('.rStation').value,
    time_offset: Number(div.querySelector('.rOffset').value || 0),
    distance_km: Number(div.querySelector('.rDist').value || 0),
  })).filter(r => r.station);
  const mag = document.getElementById('draftMagnitude').value;
  const body = {
    event_id: currentEvent.id,
    reason: document.getElementById('draftReason').value,
    reports,
  };
  if (mag !== '') body.magnitude = Number(mag);
  try {
    const draft = await api('/api/revisions', { method: 'POST', body: JSON.stringify(body) });
    show(draft);
    await loadDrafts();
  } catch (e) { /* 冲突等错误已展示，含当前草案编号 */ }
}

async function draftAction(id, action, data = {}) {
  try {
    const result = await api('/api/entities/' + id + '/actions', {
      method: 'POST',
      body: JSON.stringify({ action, data }),
    });
    show(result);
    await openEvent(currentEvent.id);
  } catch (e) { /* 已展示 */ }
}

async function rejectDraft(id) {
  const reason = prompt('退回原因');
  if (reason) await draftAction(id, 'reject', { reason });
}

async function loadHistory() {
  const data = await api('/api/entities/' + currentEvent.id + '/history');
  const box = document.getElementById('history');
  let html = '<h4>历史版本</h4>';
  if (!data.versions.length) html += '<p>暂无被替换的旧版本</p>';
  for (const v of data.versions) {
    html += `<p>v${v.version}（${v.status}）由 ${v.actor_id} 于 ${v.created_at} 替换，关联草案 ${v.revision_id || '-'}</p>` +
      `<pre>${JSON.stringify(v.data, null, 2)}</pre>`;
  }
  html += '<h4>处理记录</h4><table><thead><tr><th>时间</th><th>动作</th><th>处理人</th><th>角色</th><th>状态变化</th></tr></thead><tbody>';
  for (const a of data.audit) {
    html += `<tr><td>${a.created_at}</td><td>${a.action}</td><td>${a.actor_id}</td>` +
      `<td>${a.actor_role}</td><td>${a.from_status || '-'} → ${a.to_status}</td></tr>`;
  }
  box.innerHTML = html + '</tbody></table>';
  show(data);
}

addReportRow();
</script>
</body>
</html>
