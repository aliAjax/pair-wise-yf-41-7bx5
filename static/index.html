<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地震台网事件编目与修订</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }
    header {
      background: #12355b;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    main { max-width: 1180px; margin: 1.5rem auto; padding: 0 1rem; }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 1rem; align-items: start; }
    .card { background: white; border: 1px solid #e4e8f0; border-radius: 12px; padding: 1rem; box-shadow: 0 1px 3px rgba(16, 24, 40, .06); }
    h1 { font-size: 1.25rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 .75rem; }
    h3 { font-size: .95rem; margin: 1rem 0 .5rem; }
    label { display: block; font-size: .85rem; color: #42526b; margin: .65rem 0 .25rem; }
    input, textarea, select {
      width: 100%;
      border: 1px solid #ccd4e0;
      border-radius: 8px;
      padding: .55rem .65rem;
      font: inherit;
      background: white;
    }
    textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
    button {
      border: 0;
      border-radius: 8px;
      padding: .55rem .85rem;
      font: inherit;
      cursor: pointer;
      background: #1d5fa7;
      color: white;
    }
    button.secondary { background: #526070; }
    button.danger { background: #b42318; }
    button:disabled { background: #a8b3c2; cursor: not-allowed; }
    .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; }
    .toolbar > div { flex: 1; min-width: 120px; }
    .event-list { list-style: none; padding: 0; margin: .75rem 0 0; max-height: 680px; overflow: auto; }
    .event-list button {
      width: 100%;
      text-align: left;
      background: white;
      color: #172033;
      border: 1px solid #dce2ea;
      margin-bottom: .45rem;
      padding: .7rem;
    }
    .event-list button.active { border-color: #1d5fa7; box-shadow: inset 3px 0 #1d5fa7; }
    .event-title { font-weight: 650; display: flex; justify-content: space-between; gap: .5rem; }
    .event-meta { color: #667085; font-size: .78rem; margin-top: .25rem; }
    .badge { display: inline-block; border-radius: 999px; padding: .1rem .5rem; font-size: .72rem; background: #eef2f7; color: #344054; white-space: nowrap; }
    .badge.published, .badge.approved, .badge.revised { background: #e7f8ec; color: #177234; }
    .badge.pending_review { background: #fff6db; color: #965f00; }
    .badge.rejected, .badge.withdrawn { background: #feeceb; color: #b42318; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .notice { border-radius: 8px; padding: .65rem .75rem; margin: .65rem 0; background: #f2f6fc; color: #274566; font-size: .88rem; }
    .notice.error { background: #feeceb; color: #912018; }
    .notice.success { background: #eafaf0; color: #176231; }
    .muted { color: #667085; font-size: .82rem; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { border-bottom: 1px solid #edf0f5; padding: .5rem .35rem; text-align: left; vertical-align: top; }
    th { color: #4b5565; font-weight: 650; background: #fafbfd; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0b1f33; color: #e6edf3; padding: .75rem; border-radius: 8px; max-height: 260px; overflow: auto; font-size: .75rem; }
    .actions { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
    @media (max-width: 900px) { .layout, .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>地震台网事件编目与修订</h1>
  <div class="toolbar">
    <div>
      <label for="userId">用户</label>
      <input id="userId" value="analyst-1">
    </div>
    <div>
      <label for="role">角色</label>
      <select id="role">
        <option value="analyst" selected>分析员 analyst</option>
        <option value="reviewer">复核员 reviewer</option>
        <option value="admin">管理员 admin</option>
        <option value="viewer">查看者 viewer</option>
      </select>
    </div>
    <button onclick="loadEvents()">刷新列表</button>
  </div>
</header>
<main>
  <div class="layout">
    <section class="card">
      <h2>事件列表</h2>
      <div class="toolbar">
        <div>
          <label for="statusFilter">状态</label>
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="candidate">candidate</option>
            <option value="associated">associated</option>
            <option value="reviewed">reviewed</option>
            <option value="published" selected>published</option>
            <option value="revised">revised</option>
            <option value="withdrawn">withdrawn</option>
          </select>
        </div>
        <button onclick="loadEvents()">查询</button>
      </div>
      <ul id="eventList" class="event-list"><li class="muted">点击“查询”载入事件。</li></ul>
    </section>

    <section class="card">
      <h2>事件与修订草案</h2>
      <div id="emptyState" class="notice">请从左侧打开一个已发布事件。</div>
      <div id="detail" hidden></div>
    </section>
  </div>
</main>

<script>
let events = [];
let selectedEvent = null;
let selectedHistory = null;
let selectedRevisions = [];

function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value || 'anonymous',
    'X-Role': document.getElementById('role').value || 'viewer'
  };
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { ...headers(), ...(options.headers || {}) }
  });
  const payload = await response.json();
  if (!response.ok) {
    const error = new Error(payload.error || ('请求失败 (' + response.status + ')'));
    error.payload = payload;
    throw error;
  }
  return payload;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function statusBadge(status) {
  return '<span class="badge ' + escapeHtml(status) + '">' + escapeHtml(status) + '</span>';
}

async function loadEvents() {
  const status = document.getElementById('statusFilter').value;
  const payload = await api('/api/events' + (status ? '?status=' + encodeURIComponent(status) : ''));
  events = payload.items || [];
  const list = document.getElementById('eventList');
  if (!events.length) {
    list.innerHTML = '<li class="muted">没有符合条件的事件。</li>';
    return;
  }
  list.innerHTML = events.map(event => `
    <li>
      <button class="${selectedEvent && selectedEvent.id === event.id ? 'active' : ''}" onclick="openEvent('${encodeURIComponent(event.id)}')">
        <span class="event-title">
          <span>${escapeHtml(event.data.title || event.id)}</span>
          ${statusBadge(event.status)}
        </span>
        <span class="event-meta">编号：${escapeHtml(event.id)} · v${event.version} · 报告 ${event.data.reports?.length || 0} 份</span>
      </button>
    </li>
  `).join('');
}

async function openEvent(encodedId) {
  const id = decodeURIComponent(encodedId);
  document.getElementById('emptyState').hidden = true;
  const detail = document.getElementById('detail');
  detail.hidden = false;
  detail.innerHTML = '<div class="notice">正在载入事件……</div>';
  try {
    [selectedEvent, selectedHistory, selectedRevisions] = await Promise.all([
      api('/api/entities/' + encodeURIComponent(id)),
      api('/api/events/' + encodeURIComponent(id) + '/history'),
      api('/api/events/' + encodeURIComponent(id) + '/revisions').then(x => x.items || [])
    ]);
    renderDetail();
  } catch (error) {
    detail.innerHTML = '<div class="notice error">' + escapeHtml(error.message) + '</div>';
  }
}

function pendingRevision() {
  return selectedRevisions.find(item => item.status === 'pending_review');
}

function renderDetail() {
  const event = selectedEvent;
  const pending = pendingRevision();
  const draftReports = pending
    ? JSON.stringify(pending.data.added_reports || [], null, 2)
    : JSON.stringify([{station: 'STA-NEW', time_offset: 1, distance_km: 1.2}], null, 2);
  const draftMagnitude = pending ? pending.data.magnitude : (event.data.magnitude ?? '');

  document.getElementById('detail').innerHTML = `
    <div class="grid">
      <div>
        <h2>${escapeHtml(event.data.title || event.id)}</h2>
        <div class="muted">原编号沿用：${escapeHtml(event.id)}</div>
        <div class="muted">当前对外版本：v${event.version}，状态 ${statusBadge(event.status)}</div>
        <div class="muted">当前震级：${escapeHtml(event.data.magnitude ?? '未记录')}；报告：${event.data.reports?.length || 0} 份</div>
      </div>
      <div class="notice">
        复核通过前只更新草案，不替换当前对外版本。同一事件同时只能有一个待审草案。
      </div>
    </div>

    <div id="formMessage"></div>

    <div class="card" style="box-shadow:none; margin-top:.8rem;">
      <h2>修订草案</h2>
      <div id="pendingInfo"></div>
      <label for="reason">修订原因</label>
      <input id="reason" placeholder="例如：台网补报到达，需要重新复核震级">
      <label for="addedReports">新增报告（JSON 数组；至少一份，没有新增报告不能提交）</label>
      <textarea id="addedReports">${escapeHtml(draftReports)}</textarea>
      <div class="grid">
        <div>
          <label for="magnitude">震级复核结果 *</label>
          <input id="magnitude" type="number" step="0.1" min="0" value="${escapeHtml(draftMagnitude)}">
        </div>
        <div>
          <label for="magnitudeNote">复核说明</label>
          <input id="magnitudeNote" placeholder="可选">
        </div>
      </div>
      <div class="actions">
        <button id="submitDraft" onclick="submitDraft()">提交草案进入复核</button>
        <button class="secondary" onclick="validateDraftForm(true)">检查表单</button>
      </div>
      <p class="muted">提交时校验当前版本：v${event.version}。草案编号形如 ${escapeHtml(event.id)}-R001。</p>
    </div>

    <div class="grid" style="margin-top:.8rem;">
      <div class="card" style="box-shadow:none;">
        <h2>草案状态</h2>
        ${renderRevisions()}
      </div>
      <div class="card" style="box-shadow:none;">
        <h2>可查询历史</h2>
        ${renderHistory()}
      </div>
    </div>
  `;

  if (pending) {
    document.getElementById('submitDraft').disabled = true;
    document.getElementById('pendingInfo').innerHTML = `
      <div class="notice">当前已有待审草案：<strong>${escapeHtml(pending.id)}</strong>（${escapeHtml(pending.status)}）。
      请等待复核结论，不能同时排队。</div>
      <div class="actions">
        <button onclick="decideRevision('approve')">复核通过</button>
        <button class="danger" onclick="decideRevision('reject')">退回草案</button>
      </div>
    `;
  }
  validateDraftForm(false);
}

function renderRevisions() {
  if (!selectedRevisions.length) return '<div class="muted">暂无修订草案。</div>';
  return `<table>
    <thead><tr><th>草案编号</th><th>状态</th><th>提交人/时间</th><th>复核人/时间</th></tr></thead>
    <tbody>${selectedRevisions.map(item => `
      <tr>
        <td>${escapeHtml(item.id)}<br><span class="muted">基于 v${item.event_version}</span></td>
        <td>${statusBadge(item.status)}</td>
        <td>${escapeHtml(item.created_by)}<br><span class="muted">${escapeHtml(item.created_at)}</span></td>
        <td>${escapeHtml(item.reviewed_by || '—')}<br><span class="muted">${escapeHtml(item.reviewed_at || '')}</span></td>
      </tr>`).join('')}</tbody>
  </table>`;
}

function renderHistory() {
  const versions = selectedHistory.versions || [];
  return `<table>
    <thead><tr><th>版本</th><th>状态</th><th>处理人</th><th>报告/震级</th></tr></thead>
    <tbody>${versions.map(item => `
      <tr>
        <td>v${item.version}</td>
        <td>${statusBadge(item.status)}</td>
        <td>创建：${escapeHtml(item.created_by)}<br>处理：${escapeHtml(item.updated_by || '—')}</td>
        <td>${item.data.reports?.length || 0} 份<br>M ${escapeHtml(item.data.magnitude ?? '—')}</td>
      </tr>`).join('')}</tbody>
  </table>`;
}

function showFormMessage(message, ok = false) {
  const node = document.getElementById('formMessage');
  if (!node) return;
  node.innerHTML = message ? `<div class="notice ${ok ? 'success' : 'error'}">${escapeHtml(message)}</div>` : '';
}

function validateDraftForm(showResult) {
  let reports;
  try {
    reports = JSON.parse(document.getElementById('addedReports').value || '[]');
  } catch (error) {
    if (showResult) showFormMessage('新增报告必须是合法 JSON 数组。');
    return null;
  }
  if (!Array.isArray(reports) || reports.length === 0) {
    if (showResult) showFormMessage('没有新增报告的修订不能进入复核。');
    return null;
  }
  const magnitude = document.getElementById('magnitude').value;
  if (magnitude === '' || Number(magnitude) < 0) {
    if (showResult) showFormMessage('请填写非负的震级复核结果。');
    return null;
  }
  if (showResult) showFormMessage('表单可以提交。', true);
  return reports;
}

async function submitDraft() {
  const reports = validateDraftForm(true);
  if (!reports || !selectedEvent) return;
  const body = {
    reason: document.getElementById('reason').value,
    added_reports: reports,
    magnitude: Number(document.getElementById('magnitude').value),
    magnitude_note: document.getElementById('magnitudeNote').value,
    expected_version: selectedEvent.version
  };
  try {
    await api('/api/events/' + encodeURIComponent(selectedEvent.id) + '/revisions', {
      method: 'POST',
      body: JSON.stringify(body)
    });
    await openEvent(selectedEvent.id);
    showFormMessage('草案已提交，等待复核。', true);
  } catch (error) {
    const detail = error.payload?.details?.revision_id;
    showFormMessage(detail ? error.message + '（草案编号：' + detail + '）' : error.message);
    await openEvent(selectedEvent.id);
  }
}

async function decideRevision(action) {
  const pending = pendingRevision();
  if (!pending) return;
  const body = action === 'approve'
    ? {
        review_result: 'updated',
        magnitude: Number(document.getElementById('magnitude').value || pending.data.magnitude),
        magnitude_note: document.getElementById('magnitudeNote').value
      }
    : {};
  try {
    await api('/api/entities/' + encodeURIComponent(pending.id) + '/actions', {
      method: 'POST',
      body: JSON.stringify({ action, data: body })
    });
    await openEvent(selectedEvent.id);
    showFormMessage(action === 'approve' ? '复核通过，新内容已替换对外版本。' : '草案已退回。', true);
  } catch (error) {
    showFormMessage(error.message);
  }
}

document.getElementById('role').addEventListener('change', () => {
  if (selectedEvent) renderDetail();
});
loadEvents();
</script>
</body>
</html>
